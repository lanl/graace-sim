[project]
name = "graace-sim"
version = "0.2.1"
description = "GEANT4 framework for modeling Prompt Gamma Activation Analysis (PGAA) experiments"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]
preview = ["pixi-build"]

[dependencies]
graace-sim = { path = "." }
python = ">=3.12,<3.14"
pyarrow = "*"
pandas = ">=2.3.1,<3.0"
pillow = ">=11.3.0,<12.0"
matplotlib = "*"
pytest = "*"

[package]
name = "graace-sim"
version = "0.2.1"
description = "GEANT4 framework for modeling Prompt Gamma Activation Analysis (PGAA) experiments"
license = "GPL-3.0-or-later"
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/lanl/graace-sim"

[package.build]
backend = { name = "pixi-build-cmake", version = "0.*" }
channels = ["conda-forge"]

[package.build.configuration]
extra-args = ["-DCMAKE_BUILD_TYPE=Release"]
extra-input-globs = ["src/**/*.py"]

[package.host-dependencies]
cmake = "*"
python = ">=3.12,<3.14"
geant4 = "*"
libarrow = "*"
libparquet = "*"
libarrow-dataset = "*"
expat = "*"
freetype = ">=2.14.3"

[package.run-dependencies]
python = ">=3.12,<3.14"
pydantic = ">=2"
pyyaml = "*"
loguru = "*"
geant4 = "*"
libarrow = "*"
libparquet = "*"
libarrow-dataset = "*"
freetype = ">=2.14.3"

[tasks.test]
description = "Run the Python test suite"
cmd = "pytest"

[tasks.build-sim]
description = "Build the graace-sim conda package with its GEANT4 engine"
cmd = "pixi build --output-dir dist"

[tasks.clean-sim]
description = "Remove package build artifacts"
cmd = "rm -rf dist"

[tasks.rebuild-sim]
description = "Clean and build the graace-sim conda package"
depends-on = ["clean-sim", "build-sim"]
