[project]
name = "graace-sim"
version = "0.1.0"
description = "GEANT4 framework for modeling Prompt Gamma Activation Analysis (PGAA) experiments"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
geant4 = "*"
libarrow = "*"
libparquet = "*"
libarrow-dataset = "*"
cmake = "*"
ninja = "*"
cxx-compiler = "*"
pyarrow = "*"
pandas = ">=2.3.1,<3.0"
pillow = ">=11.3.0,<12.0"
matplotlib = "*"
python = ">=3.12,<3.14"
pydantic = ">=2"
pyyaml = "*"
loguru = "*"
pytest = "*"

# Put the source directory on the import path for everything run in the
# environment (the test suite and the example scripts), so nothing has to adjust
# `sys.path` by hand.
[activation]
env = { PYTHONPATH = "src" }

[tasks.test]
description = "Run the Python test suite"
cmd = "pytest"

[tasks.build-sim]
description = "Compile the GEANT4 engine and install graace-sim onto PATH"
cmd = "cmake -S sim -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$CONDA_PREFIX -DHDF5_ROOT=$CONDA_PREFIX && cmake --build build && cmake --install build"

[tasks.clean-sim]
description = "Remove the build directory"
cmd = "rm -rf build"

[tasks.rebuild-sim]
description = "Clean and compile the GEANT4 engine from scratch"
depends-on = ["clean-sim", "build-sim"]
