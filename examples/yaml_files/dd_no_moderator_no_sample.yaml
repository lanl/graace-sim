# Background measurement (1 of 4): DD generator, no moderator, no sample at all.
#
# These four runs measure what the detectors record when there is nothing to
# measure. They are copies of the four generator-comparison runs with the iron
# sample deleted and everything else left alone.
#
# Why they are needed. The detectors record every gamma that reaches them, and
# not all of those gammas come from the sample. Neutrons also scatter off the
# air, off the moderator slab, and into the germanium crystals themselves, and
# each of those makes gammas the detector cannot tell apart from the sample's.
# The recorded file holds only an energy and a time, so nothing in the data says
# where a gamma was made.
#
# That matters as soon as two samples of different size are compared. Whatever
# the detectors would have recorded with no sample present is there in both runs
# unchanged, so it has to be subtracted from both before the difference between
# them can be called a property of the sample. Without these four runs a claim
# about self-shielding would be partly a statement about the moderator slab.
#
# One per condition, because the background is not the same in all four: a
# moderator slab in the beam is itself a large source of gammas, and how many
# neutrons reach the detectors at all depends on the generator energy.
#
#   dd_no_moderator_no_sample.yaml     dd_with_moderator_no_sample.yaml
#   dt_no_moderator_no_sample.yaml     dt_with_moderator_no_sample.yaml

# --- Source: 2.45 MeV (DD generator) neutrons, a pencil beam along +z ---
source:
  particle: neutron
  position:
    shape: point
    center_mm: {x_mm: 0, y_mm: 0, z_mm: -130}
  energy:
    type: mono
    mono_mev: 2.45

# --- Sample: none in this run, which is the whole point of it ---

# --- Moderator: none in this run ---

# --- Detectors: two HPGe crystals, one above and one below where the sample would be ---
detectors:
  - name: hpge_top
    type: HPGe
    position_mm: {x_mm: 0, y_mm: 80, z_mm: 0}
    dimension_mm: {x_mm: 60, y_mm: 60, z_mm: 50}
  - name: hpge_bottom
    type: HPGe
    position_mm: {x_mm: 0, y_mm: -80, z_mm: 0}
    dimension_mm: {x_mm: 60, y_mm: 60, z_mm: 50}

# --- Run: how many neutrons to fire ---
# The same count as every other run in the comparison, so the background can be
# subtracted directly with no scaling.
run:
  neutrons: 10000000
  seed: 1

# --- Metadata: who, when, and what this run is ---
metadata:
  author: GRAACE-SIM
  date: "2026-09-09"
  description: DD generator (2.45 MeV), no sample, no moderator; background only.

# --- Environment: the run's identity and where its files live ---
environment:
  working_directory: data
  run_id: dd_no_moderator_no_sample
  sub_run: 0
