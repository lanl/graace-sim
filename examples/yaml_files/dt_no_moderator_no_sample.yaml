# Background measurement (3 of 4): DT generator, no moderator, no sample at all.
#
# See dd_no_moderator_no_sample.yaml for why these four runs exist and how
# they are used. This one is a copy of dt_no_moderator.yaml
# with the iron sample deleted and everything else left alone.
#
# --- Source: 14.1 MeV (DT generator) neutrons, a pencil beam along +z ---
source:
  particle: neutron
  position:
    shape: point
    center_mm: {x_mm: 0, y_mm: 0, z_mm: -130}
  energy:
    type: mono
    mono_mev: 14.1

# --- Sample: none in this run, which is the whole point of it ---

# --- Moderator: none in this run ---

# --- Detectors: two HPGe crystals, one above and one below where the sample would be ---
detectors:
  - name: hpge_top
    type: HPGe
    position_mm: {x_mm: 0, y_mm: 80, z_mm: 0}
    dimension_mm: {x_mm: 60, y_mm: 60, z_mm: 50}
  - name: hpge_bottom
    type: HPGe
    position_mm: {x_mm: 0, y_mm: -80, z_mm: 0}
    dimension_mm: {x_mm: 60, y_mm: 60, z_mm: 50}

# --- Run: how many neutrons to fire ---
# The same count as every other run in the comparison, so the background can be
# subtracted directly with no scaling.
run:
  neutrons: 10000000
  seed: 1

# --- Metadata: who, when, and what this run is ---
metadata:
  author: GRAACE-SIM
  date: "2026-09-09"
  description: DT generator (14.1 MeV), no sample, no moderator; background only.

# --- Environment: the run's identity and where its files live ---
environment:
  working_directory: data
  run_id: dt_no_moderator_no_sample
  sub_run: 0
