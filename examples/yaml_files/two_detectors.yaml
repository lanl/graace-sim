# Example configuration: a 14.1 MeV DT neutron source irradiates an iron sample
# with two HPGe detectors on opposite sides, each recording gamma hits under its
# own name (hpge_top and hpge_bottom in the output).

# --- Source: 14.1 MeV (DT generator) neutrons, starting 50 mm before the sample ---
source:
  particle: neutron
  position:
    shape: point
    center_mm: {x_mm: 0, y_mm: 0, z_mm: -50}
  energy:
    type: mono
    mono_mev: 14.1

# --- Sample: an iron cylinder (radius 10 mm, height 20 mm) at the origin ---
sample:
  composition:
    density_g_cm3: 7.87
    elements:
      - {symbol: Fe, mass_fraction: 1.0}
  shape: cylinder
  size_mm: 10      # cylinder radius
  height_mm: 20    # cylinder height
  position_mm: {x_mm: 0, y_mm: 0, z_mm: 0}

# --- Detectors: two HPGe crystals, one on each side of the sample ---
# Each crystal is a cylinder (radius 30 mm, height 50 mm); dimension_mm is its
# bounding box (60 x 60 x 50 mm). The writer maps the box back to the crystal:
# radius = x_mm / 2, height = z_mm. Each detector's name labels its output
# subdirectory: results/hpge_top/... and results/hpge_bottom/....
detectors:
  - name: hpge_top
    type: HPGe
    position_mm: {x_mm: 0, y_mm: 80, z_mm: 0}
    dimension_mm: {x_mm: 60, y_mm: 60, z_mm: 50}
  - name: hpge_bottom
    type: HPGe
    position_mm: {x_mm: 0, y_mm: -80, z_mm: 0}
    dimension_mm: {x_mm: 60, y_mm: 60, z_mm: 50}

# --- Run: how many neutrons to fire ---
run:
  neutrons: 10000

# --- Metadata: who, when, and what this run is ---
metadata:
  author: GRAACE-SIM
  date: "2026-08-06"
  description: DT generator irradiating an iron sample with two opposed HPGe detectors.

# --- Environment: the run's identity and where its files live ---
environment:
  working_directory: data
  run_id: two_detectors
  sub_run: 0
