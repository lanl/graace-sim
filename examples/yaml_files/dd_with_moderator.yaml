# Generator comparison (2 of 4): DD generator, with a moderator.
#
# See dd_no_moderator.yaml for the full description of the 2x2 comparison and
# what to look for in the spectra. This run is the same as that one with a
# 50 mm slab of polyethylene added between the generator and the sample.

# --- Source: 2.45 MeV (DD generator) neutrons, a pencil beam along +z ---
source:
  particle: neutron
  position:
    shape: point
    center_mm: {x_mm: 0, y_mm: 0, z_mm: -130}
  energy:
    type: mono
    mono_mev: 2.45

# --- Sample: an iron cylinder (radius 25 mm, height 40 mm) at the origin ---
sample:
  composition:
    density_g_cm3: 7.87
    elements:
      - {symbol: Fe, mass_fraction: 1.0}
  shape: cylinder
  size_mm: 25      # cylinder radius
  height_mm: 40    # cylinder height (along the beam axis)
  position_mm: {x_mm: 0, y_mm: 0, z_mm: 0}

# --- Moderator: 50 mm of polyethylene in the beam, ahead of the sample ---
# The engine builds each of these blocks as a 200 x 200 mm plate whose
# thickness runs along the beam axis. Centred at z = -60 mm it fills
# z = -85 mm to -35 mm: downstream of the generator at -130 mm, and clear of
# both the sample (which starts at -20 mm) and the detectors (which start at
# -25 mm), so no two volumes overlap.
shielding:
  - material: G4_POLYETHYLENE
    thickness_mm: 50
    position_mm: {x_mm: 0, y_mm: 0, z_mm: -60}

# --- Detectors: two HPGe crystals, one above and one below the sample ---
detectors:
  - name: hpge_top
    type: HPGe
    position_mm: {x_mm: 0, y_mm: 80, z_mm: 0}
    dimension_mm: {x_mm: 60, y_mm: 60, z_mm: 50}
  - name: hpge_bottom
    type: HPGe
    position_mm: {x_mm: 0, y_mm: -80, z_mm: 0}
    dimension_mm: {x_mm: 60, y_mm: 60, z_mm: 50}

# --- Run: how many neutrons to fire ---
run:
  neutrons: 10000000
  seed: 1

# --- Metadata: who, when, and what this run is ---
metadata:
  author: GRAACE-SIM
  date: "2026-09-09"
  description: DD generator (2.45 MeV) on iron, behind 50 mm of polyethylene.

# --- Environment: the run's identity and where its files live ---
environment:
  working_directory: data
  run_id: dd_with_moderator
  sub_run: 0
