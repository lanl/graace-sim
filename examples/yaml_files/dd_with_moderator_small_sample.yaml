# Self-shielding comparison (4 of 4): DD generator, with a moderator, small sample.
#
# See dd_no_moderator_small_sample.yaml for the table of all eight runs, and
# dt_no_moderator_small_sample.yaml for what the small-sample runs are for. This
# run is the same as dd_with_moderator.yaml with the iron sample scaled down by a
# factor of five in every direction.
#
# Of the eight runs this is where self-shielding should be largest. A 2.45 MeV
# neutron needs far fewer collisions to slow down than a 14.1 MeV one, so 50 mm
# of polyethylene thermalizes a DD beam more completely than a DT beam, and slow
# neutrons are absorbed by iron much more readily than fast ones. The outer
# layers of the full-size sample therefore take most of them before they reach
# the middle. That is what the counts show. With the no-sample background taken
# off both runs, the full-size sample here records 6.0 times the counts of the
# small one, against 4.4 for the DT pair with a moderator and 3.6 to 3.8 for the
# two pairs with no moderator.
#
# The comparison of spectrum shapes is the weak one in this pair, though. The
# moderator slab is itself a large source of gammas, and here it accounts for 93%
# of everything the detectors record in the small-sample run, so once it is
# subtracted there are too few counts left above 1 MeV for the band-to-band
# ratios to say much. The two runs with no moderator are where that part of the
# comparison is worth trusting.

# --- Source: 2.45 MeV (DD generator) neutrons, a pencil beam along +z ---
source:
  particle: neutron
  position:
    shape: point
    center_mm: {x_mm: 0, y_mm: 0, z_mm: -130}
  energy:
    type: mono
    mono_mev: 2.45

# --- Sample: an iron cylinder (radius 5 mm, height 8 mm) at the origin ---
# One fifth the size of the full-size runs in every direction, so the shape is
# unchanged and size is the only difference.
sample:
  composition:
    density_g_cm3: 7.87
    elements:
      - {symbol: Fe, mass_fraction: 1.0}
  shape: cylinder
  size_mm: 5       # cylinder radius
  height_mm: 8     # cylinder height (along the beam axis)
  position_mm: {x_mm: 0, y_mm: 0, z_mm: 0}

# --- Moderator: 50 mm of polyethylene in the beam, ahead of the sample ---
# Identical placement to dd_with_moderator.yaml: a 200 x 200 mm plate filling
# z = -85 mm to -35 mm, clear of the sample and both detectors.
shielding:
  - material: G4_POLYETHYLENE
    thickness_mm: 50
    position_mm: {x_mm: 0, y_mm: 0, z_mm: -60}

# --- Detectors: two HPGe crystals, one above and one below the sample ---
detectors:
  - name: hpge_top
    type: HPGe
    position_mm: {x_mm: 0, y_mm: 80, z_mm: 0}
    dimension_mm: {x_mm: 60, y_mm: 60, z_mm: 50}
  - name: hpge_bottom
    type: HPGe
    position_mm: {x_mm: 0, y_mm: -80, z_mm: 0}
    dimension_mm: {x_mm: 60, y_mm: 60, z_mm: 50}

# --- Run: how many neutrons to fire ---
# The same count as every other run in the comparison, so the spectra can be read
# against one another with no scaling.
run:
  neutrons: 10000000
  seed: 1

# --- Metadata: who, when, and what this run is ---
metadata:
  author: GRAACE-SIM
  date: "2026-09-09"
  description: DD generator (2.45 MeV) on a small iron sample, behind 50 mm of polyethylene.

# --- Environment: the run's identity and where its files live ---
environment:
  working_directory: data
  run_id: dd_with_moderator_small_sample
  sub_run: 0
